function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function rk(r){return r==null?'20위권 밖':r+'위';}
function cls(cur,prev){if(cur==null||prev==null)return'flat';return cur<prev?'up':cur>prev?'down':'flat';}
function mv(cur,prev){if(prev==null)return'비교 데이터 없음';if(cur==null)return'20위권 밖';if(cur<prev)return(prev-cur)+'단계 상승';if(cur>prev)return(cur-prev)+'단계 하락';return'변동 없음';}
function prevDate(day){var i=D.dates.indexOf(day);return i>=0&&i+1<D.dates.length?D.dates[i+1]:null;}
function selectedKeyword(){return document.getElementById('keywordSel').value;}
function renderRanks(){
 var day=document.getElementById('dateSel').value,pd=prevDate(day);
 var cur=D.byDate[day]||{},prev=pd?(D.byDate[pd]||{}):{};
 document.getElementById('currentDate').textContent=day||'-';
 var cards=D.keywords.map(function(k){
  var c=cur[k.q],p=prev[k.q],cr=c?c.rank:null,pr=p?p.rank:null;
  return '<article class="rank-card"><div class="keyword">'+esc(k.label)+'</div>'+
   '<div class="rank-line"><span class="rank">'+(c?rk(cr):'-')+'</span><span class="previous">이전 '+(p?rk(pr):'-')+'</span></div>'+
   '<span class="change '+cls(cr,pr)+'">'+(c?mv(cr,pr):'측정 데이터 없음')+'</span></article>';
 }).join('');
 document.getElementById('ranks').innerHTML=cards||'<div class="empty">표시할 순위가 없습니다.</div>';
 renderMap();
}
function renderMap(){
 var day=document.getElementById('dateSel').value,q=document.getElementById('mapSel').value;
 var c=(D.byDate[day]||{})[q],k=D.keywords.find(function(item){return item.q===q;});
 if(!c||!c.image){document.getElementById('map').innerHTML='<div class="empty">선택한 날짜의 지도가 없습니다.</div>';return;}
 var href=c.url||c.image;
 document.getElementById('map').innerHTML='<div class="map-body"><div class="map-meta">'+
  esc(k?k.label:q)+' · '+rk(c.rank)+' · 선택일 '+esc(day)+'</div>'+
  '<a href="'+esc(href)+'" target="_blank" rel="noopener"><img src="'+esc(c.image)+'" alt="'+esc(k?k.label:q)+' 위치별 순위 지도"></a></div>';
}
function renderHistory(){
 var q=selectedKeyword();
 var value=document.getElementById('rangeSel').value;
 var dates=value==='all'?D.dates:D.dates.slice(0,parseInt(value,10));
 var rows=dates.map(function(day){
  var c=(D.byDate[day]||{})[q];
  return '<div class="history-row"><span class="history-date">'+esc(day)+'</span><span class="history-rank">'+(c?rk(c.rank):'-')+'</span></div>';
 }).join('');
 document.getElementById('history').innerHTML=rows||'<div class="empty">과거 순위가 없습니다.</div>';
}
(function(){
 var dateSel=document.getElementById('dateSel'),keywordSel=document.getElementById('keywordSel'),mapSel=document.getElementById('mapSel');
 D.dates.forEach(function(day){var o=document.createElement('option');o.value=day;o.textContent=day;dateSel.appendChild(o);});
 D.keywords.forEach(function(k){var o=document.createElement('option');o.value=k.q;o.textContent=k.label;keywordSel.appendChild(o);mapSel.appendChild(o.cloneNode(true));});
 dateSel.value=D.dates[0]||'';keywordSel.value=D.keywords.length?D.keywords[0].q:'';mapSel.value=keywordSel.value;
 renderRanks();renderHistory();
})();
