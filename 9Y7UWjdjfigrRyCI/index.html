<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex,nofollow"><title>반가 숯불 닭갈비 홍대점 (Vanga Dakgalbi Hongdae) 구글 지도 순위 보고</title><style>*{box-sizing:border-box}:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif}
body{margin:0;background:#f4f6f8;color:#17202a;line-height:1.45}

.history-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:8px}.history-head .panel-title{margin:0}.range{width:130px}

.history-date{font-size:14px}.history-rank{font-size:16px;font-weight:800}
.map-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.map-head .panel-title{margin:0}.map-control{width:min(100%,280px)}
.map-body{border:1px solid #e3e8ef;border-radius:12px;padding:12px;background:#fbfcfd}.map-meta{color:#687386;font-size:12px;margin-bottom:8px}
img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid #e3e8ef;background:#f7f8fa}
.empty{color:#7b8797;font-size:14px;padding:10px 0}
.foot{color:#8590a0;font-size:11px;text-align:center;padding-top:6px}
@media(max-width:680px){.wrap{padding:12px 10px 28px}.hero{padding:20px 17px;border-radius:16px}.panel{padding:15px;border-radius:14px}.controls{grid-template-columns:1fr}.rank-grid{grid-template-columns:1fr}.keyword{min-height:0}.rank-line{align-items:center}.rank{font-size:26px}.history-head{align-items:center}.range{width:120px}.map-head{display:block}.map-control{width:100%;margin-top:10px}}
@media(min-width:681px){.rank-card:only-child{grid-column:span 3}.rank-card:nth-last-child(2):first-child,.rank-card:nth-last-child(2):first-child~.rank-card{grid-column:span 1}}</style></head><body><main class=wrap><header class=hero><div class=eyebrow>GOOGLE MAP RANKING REPORT</div><h1>반가 숯불 닭갈비 홍대점 (Vanga Dakgalbi Hongdae)</h1><div class=hero-sub>최신 측정일 2026-11-27</div></header><section class=panel><div class=controls><div><label for=dateSel>조회 날짜</label><select id=dateSel onchange=renderRanks()></select></div><div><label for=keywordSel>과거 순위 키워드</label><select id=keywordSel onchange=renderHistory()></select></div></div></section><section class=panel><h2 class=panel-title><span id=currentDate></span> 순위</h2><div class=rank-grid id=ranks></div></section><section class=panel><div class=map-head><h2 class=panel-title>위치별 순위 지도</h2><div class=map-control><label for=mapSel>지도 키워드</label><select id=mapSel onchange=renderMap()></select></div></div><div id=map></div></section><section class=panel><div class=history-head><h2 class=panel-title>과거 순위</h2><div class=range><label for=rangeSel>표시 기간</label><select id=rangeSel onchange=renderHistory()><option value=8>최근 8회</option><option value=16>최근 16회</option><option value=all>전체</option></select></div></div><div class=history-list id=history></div></section><script>
var D={"name": "반가 숯불 닭갈비 홍대점 (Vanga Dakgalbi Hongdae)", "rank_mode": "reported", "keywords": [{"q": "Hongdae korean bbq", "label": "Hongdae korean bbq"}, {"q": "弘大 美食", "label": "弘大 美食"}], "dates": ["2026-11-27", "2026-11-24", "2026-11-16", "2026-11-09"], "byDate": {"2026-11-27": {"弘大 美食": {"rank": 11, "arp": "10.86", "solv": "0.00", "image": "https://lf-static-v2.localfalcon.com/image/3d9bf197c8b6661/42109c59bd6a5c3", "url": "https://localrankingtracker.com/scan-report/3d9bf197c8b6661/42109c59bd6a5c3/"}, "Hongdae korean bbq": {"rank": 2, "arp": "2.20", "solv": "80.00", "image": "https://lf-static-v2.localfalcon.com/image/21788535c9da4d9/42109c59bd6a5c3", "url": "https://localrankingtracker.com/scan-report/21788535c9da4d9/42109c59bd6a5c3/"}}, "2026-11-24": {"弘大 美食": {"rank": 9, "arp": "9.13", "solv": "0.00", "image": "https://lf-static-v2.localfalcon.com/image/179e66181197197/42109c59bd6a5c3", "url": "https://localrankingtracker.com/scan-report/179e66181197197/42109c59bd6a5c3/"}, "Hongdae korean bbq": {"rank": 2, "arp": "1.84", "solv": "92.00", "image": "https://lf-static-v2.localfalcon.com/image/b899b6bf49d4fda/42109c59bd6a5c3", "url": "https://localrankingtracker.com/scan-report/b899b6bf49d4fda/42109c59bd6a5c3/"}}, "2026-11-16": {"弘大 美食": {"rank": null, "arp": "21.00", "solv": "0.00", "image": "https://lf-static-v2.localfalcon.com/image/675abda813a0dac/42109c59bd6a5c3", "url": "https://localrankingtracker.com/scan-report/675abda813a0dac/42109c59bd6a5c3/"}, "Hongdae korean bbq": {"rank": 4, "arp": "4.00", "solv": "72.00", "image": "https://lf-static-v2.localfalcon.com/image/5d36225140c9ecd/42109c59bd6a5c3", "url": "https://localrankingtracker.com/scan-report/5d36225140c9ecd/42109c59bd6a5c3/"}}, "2026-11-09": {"Hongdae korean bbq": {"rank": 14, "arp": "2.76", "solv": "76.00", "image": "https://lf-static-v2.localfalcon.com/image/5a455f85ff389be/42109c59bd6a5c3", "url": "https://localrankingtracker.com/scan-report/5a455f85ff389be/42109c59bd6a5c3/"}, "弘大 美食": {"rank": null, "arp": "21.00", "solv": "0.00", "image": "https://lf-static-v2.localfalcon.com/image/f8b2a03986f4fdb/42109c59bd6a5c3", "url": "https://localrankingtracker.com/scan-report/f8b2a03986f4fdb/42109c59bd6a5c3/"}}}};
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function rk(r){return r==null?'20위권 밖':r+'위';}
function cls(cur,prev){if(cur==null||prev==null)return'flat';return cur<prev?'up':cur>prev?'down':'flat';}
function mv(cur,prev){if(prev==null)return'비교 데이터 없음';if(cur==null)return'20위권 밖';if(cur<prev)return(prev-cur)+'단계 상승';if(cur>prev)return(cur-prev)+'단계 하락';return'변동 없음';}
function prevDate(day){var i=D.dates.indexOf(day);return i>=0&&i+1<D.dates.length?D.dates[i+1]:null;}
function selectedKeyword(){return document.getElementById('keywordSel').value;}
function renderRanks(){
 var day=document.getElementById('dateSel').value,pd=prevDate(day);
 var cur=D.byDate[day]||{},prev=pd?(D.byDate[pd]||{}):{};
 document.getElementById('currentDate').textContent=day||'-';
 var cards=D.keywords.map(function(k){
  var c=cur[k.q],p=prev[k.q],cr=c?c.rank:null,pr=p?p.rank:null;
  return '<article class="rank-card"><div class="keyword">'+esc(k.label)+'</div>'+
   '<div class="rank-line"><span class="rank">'+(c?rk(cr):'-')+'</span><span class="previous">이전 '+(p?rk(pr):'-')+'</span></div>'+
   '<span class="change '+cls(cr,pr)+'">'+(c?mv(cr,pr):'측정 데이터 없음')+'</span></article>';
 }).join('');
 document.getElementById('ranks').innerHTML=cards||'<div class="empty">표시할 순위가 없습니다.</div>';
 renderMap();
}
function renderMap(){
 var day=document.getElementById('dateSel').value,q=document.getElementById('mapSel').value;
 var c=(D.byDate[day]||{})[q],k=D.keywords.find(function(item){return item.q===q;});
 if(!c||!c.image){document.getElementById('map').innerHTML='<div class="empty">선택한 날짜의 지도가 없습니다.</div>';return;}
 var href=c.url||c.image;
 document.getElementById('map').innerHTML='<div class="map-body"><div class="map-meta">'+
  esc(k?k.label:q)+' · '+rk(c.rank)+' · 선택일 '+esc(day)+'</div>'+
  '<a href="'+esc(href)+'" target="_blank" rel="noopener"><img src="'+esc(c.image)+'" alt="'+esc(k?k.label:q)+' 위치별 순위 지도"></a></div>';
}
function renderHistory(){
 var q=selectedKeyword();
 var value=document.getElementById('rangeSel').value;
 var dates=value==='all'?D.dates:D.dates.slice(0,parseInt(value,10));
 var rows=dates.map(function(day){
  var c=(D.byDate[day]||{})[q];
  return '<div class="history-row"><span class="history-date">'+esc(day)+'</span><span class="history-rank">'+(c?rk(c.rank):'-')+'</span></div>';
 }).join('');
 document.getElementById('history').innerHTML=rows||'<div class="empty">과거 순위가 없습니다.</div>';
}
(function(){
 var dateSel=document.getElementById('dateSel'),keywordSel=document.getElementById('keywordSel'),mapSel=document.getElementById('mapSel');
 D.dates.forEach(function(day){var o=document.createElement('option');o.value=day;o.textContent=day;dateSel.appendChild(o);});
 D.keywords.forEach(function(k){var o=document.createElement('option');o.value=k.q;o.textContent=k.label;keywordSel.appendChild(o);mapSel.appendChild(o.cloneNode(true));});
 dateSel.value=D.dates[0]||'';keywordSel.value=D.keywords.length?D.keywords[0].q:'';mapSel.value=keywordSel.value;
 renderRanks();renderHistory();
})();
</script></main></body></html>
